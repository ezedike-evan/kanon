# Render blueprint. One service: the gateway (packages/gateway): market data,
# and order placing when the trading variables below are filled in.
# The web app is not hosted here.
services:
  - type: web
    name: kanon-gateway
    runtime: node
    # The free plan stops a service after 15 idle minutes, and the gateway has
    # timed trades to close whether or not anybody is on the app. The backend
    # asks it for /livez every five minutes once GATEWAY_URL is set there
    # (packages/backend/convex/gateway.ts), which keeps it awake. For the weeks
    # the app is being judged, `starter` is the dependable choice: change this
    # line, or the plan on the service's own page.
    plan: free
    region: frankfurt
    # One instance on purpose: each instance holds its own venue connections and
    # cache, so a second one doubles the load on the venue instead of sharing it.
    numInstances: 1
    # The repo's .npmrc sets node-linker=hoisted, under which pnpm ignores the
    # filter and installs every workspace (Expo, Next and all). The isolated
    # linker installs only what the gateway needs. The trailing dots take the
    # workspace packages it imports with it (@kanon/execution, @kanon/spec).
    buildCommand: pnpm install --frozen-lockfile --filter "@kanon/gateway..." --config.node-linker=isolated
    startCommand: pnpm --filter @kanon/gateway start
    # Liveness, not venue health: /healthz goes 503 during a venue outage, and
    # restarting the gateway then would only throw its cache away.
    healthCheckPath: /livez
    buildFilter:
      paths:
        - packages/gateway/**
        - packages/execution/**
        - packages/spec/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PERPL_NETWORK
        value: testnet
      # Trading (/trade). Off until all four are filled in on the dashboard; they
      # are secrets and are never written here. The region above matters for
      # these: Perpl answers its trading API with HTTP 451 from regions it does
      # not serve. Its own list (`geo_block` in /v1/pub/context, read 12 October
      # 2026) is BY, CU, GB, IR, KP, RU, SY, UA and US, so Frankfurt is served.
      - key: PERPL_API_KEY
        sync: false
      - key: PERPL_API_KEY_SECRET
        sync: false
      - key: CONVEX_SITE_URL
        sync: false
      - key: VENUE_RECORDER_KEY
        sync: false
      # Browser origins allowed to connect: the web app on Vercel, then local
      # development. Add the custom domain here once there is one.
      - key: GATEWAY_ALLOWED_ORIGINS
        value: https://kanon-three.vercel.app,https://kanon-tellacash-9675s-projects.vercel.app,http://localhost:3000,http://localhost:8081
      # BTC and ETH 15m on testnet, kept in memory from start.
      - key: GATEWAY_WARM_STREAMS
        value: candles@16*900,candles@32*900
