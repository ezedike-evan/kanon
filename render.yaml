# Render blueprint. One service: the market data gateway (packages/gateway).
# The web app is not hosted here.
services:
  - type: web
    name: kanon-gateway
    runtime: node
    # The free plan stops a service after 15 idle minutes. The gateway is only
    # useful while it holds the venue connection, so it needs a plan that stays up.
    plan: starter
    region: frankfurt
    # One instance on purpose: each instance holds its own venue connections and
    # cache, so a second one doubles the load on the venue instead of sharing it.
    numInstances: 1
    # The repo's .npmrc sets node-linker=hoisted, under which pnpm ignores the
    # filter and installs every workspace (Expo, Next and all). The isolated
    # linker installs only what the gateway needs.
    buildCommand: pnpm install --frozen-lockfile --filter @kanon/gateway --config.node-linker=isolated
    startCommand: pnpm --filter @kanon/gateway start
    # Liveness, not venue health: /healthz goes 503 during a venue outage, and
    # restarting the gateway then would only throw its cache away.
    healthCheckPath: /livez
    buildFilter:
      paths:
        - packages/gateway/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PERPL_NETWORK
        value: testnet
      # Browser origins allowed to connect. Add the deployed web app's origin here.
      - key: GATEWAY_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:8081
      # BTC and ETH 15m on testnet, kept in memory from start.
      - key: GATEWAY_WARM_STREAMS
        value: candles@16*900,candles@32*900
